image: docker:latest

services:
  - docker:dind

stages:
  - build
  - test
  - staging
  - backup
  - production
  - rollback

build-image:
  stage: build
  tags:
    - runner-BGM-16-04-2026
  script:
    - echo "Connexion au registry GitLab..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Build de l'image Docker..."
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - echo "Push de l'image vers le registry..."
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  only:
    - main

unit-test:
  stage: test
  image: python:3.9-alpine
  tags:
    - runner-BGM-16-04-2026
  before_script:
    - apk update && apk add --no-cache mariadb-dev gcc musl-dev pkgconfig
    - pip install -r requirements.txt
    - pip install pytest
  script:
    - echo "Aucun test unitaire trouvé. Vous devriez en créer dans un dossier 'tests/'."
    - pytest tests/
  when: manual
  allow_failure: true

linter:
  stage: test
  image: python:3.9-alpine
  tags:
    - runner-BGM-16-04-2026
  before_script:
    - pip install flake8
  script:
    - echo "Lancement du linter Flake8..."
    - flake8 --ignore=E501,F401,F841 .
  allow_failure: true

sast-analysis:
  stage: test
  image: python:3.9-alpine
  tags:
    - runner-BGM-16-04-2026
  before_script:
    - pip install bandit
  script:
    - echo "Lancement de l'analyse de sécurité SAST avec Bandit..."
    - bandit -r .
  allow_failure: true

deploy-staging:
  stage: staging
  tags:
    - runner-BGM-16-04-2026
  script:
    - echo "Déploiement sur l'environnement de Staging..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker rm -f appseed_app || true
    - >
      docker run -d --name appseed_app
      --network datta-able-bgm-16-04-2026_web_network
      --network datta-able-bgm-16-04-2026_db_network
      --restart always
      -e DB_ENGINE=mysql
      -e DB_HOST=mysql_db
      -e DB_PORT=3306
      -e DB_USERNAME=$DB_USERNAME
      -e DB_PASS=$DB_PASS
      -e DB_NAME=$DB_NAME
      -e SECRET_KEY=$SECRET_KEY
      $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - echo "Application déployée en Staging."
  environment:
    name: staging
    url: http://10.46.31.166:5085
  when: manual

backup-database:
  stage: backup
  tags:
    - runner-BGM-16-04-2026
  script:
    - echo "Création d'un backup de la base de données de production..."
    - docker exec mysql_db /usr/bin/mysqldump -u root -p$MYSQL_ROOT_PASSWORD $MYSQL_DATABASE > db_backup.sql
    - echo "Backup créé."
  artifacts:
    paths:
      - db_backup.sql
    expire_in: 1 week
  when: manual
  only:
    - main

deploy-production:
  stage: production
  tags:
    - runner-BGM-16-04-2026
  script:
    - echo "Déploiement sur l'environnement de Production..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Sauvegarde de l'ancienne image "latest" en "stable"
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker tag $CI_REGISTRY_IMAGE:latest $CI_REGISTRY_IMAGE:stable || true
    - docker push $CI_REGISTRY_IMAGE:stable || true
    # Pull et tag de la nouvelle image
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
    # Redéploiement du conteneur applicatif
    - docker rm -f appseed_app || true
    - >
      docker run -d --name appseed_app
      --network datta-able-bgm-16-04-2026_web_network
      --network datta-able-bgm-16-04-2026_db_network
      --restart always
      -e DB_ENGINE=mysql
      -e DB_HOST=mysql_db
      -e DB_PORT=3306
      -e DB_USERNAME=$DB_USERNAME
      -e DB_PASS=$DB_PASS
      -e DB_NAME=$DB_NAME
      -e SECRET_KEY=$SECRET_KEY
      $CI_REGISTRY_IMAGE:latest
    - echo "Application déployée en Production."
  environment:
    name: production
    url: http://10.46.31.166:5085
  when: manual
  only:
    - main

rollback-production:
  stage: rollback
  tags:
    - runner-BGM-16-04-2026
  script:
    - echo "Rollback vers la version stable précédente..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker rm -f appseed_app || true
    - >
      docker run -d --name appseed_app
      --network datta-able-bgm-16-04-2026_web_network
      --network datta-able-bgm-16-04-2026_db_network
      --restart always
      -e DB_ENGINE=mysql
      -e DB_HOST=mysql_db
      -e DB_PORT=3306
      -e DB_USERNAME=$DB_USERNAME
      -e DB_PASS=$DB_PASS
      -e DB_NAME=$DB_NAME
      -e SECRET_KEY=$SECRET_KEY
      $CI_REGISTRY_IMAGE:stable
    - echo "Rollback terminé. La version stable est de nouveau en production."
  when: manual
  only:
    - main
