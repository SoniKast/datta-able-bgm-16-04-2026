services:
  nginx:
    container_name: nginx
    restart: unless-stopped
    image: "nginx:stable-alpine"
    ports:
      - "5085:5085"
      - "5005:5085"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      - web_network
  db:
    image: "mysql:latest"
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpswd
      MYSQL_DATABASE: datta-able
      MYSQL_USER: username
      MYSQL_PASSWORD: mypassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db_network

networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge

volumes:
  mysql_data:
