services:
  appseed-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appseed_app
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"] # Vérifie l'URL de santé
      interval: 30s    # Temps entre chaque test
      timeout: 10s     # Temps avant de considérer que le test a échoué
      retries: 3       # Nombre d'échecs avant de déclarer le conteneur "unhealthy"
      start_period: 20s # Temps laissé à l'app pour démarrer avant de commencer les tests
    deploy:
      resources:
        limits:
          memory: 512M       # Évite qu'un bug ne sature ton hôte
    networks:
      - db_network
      - web_network
    environment:
      - DB_ENGINE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=myuser
      - DB_PASS=mypassword
      - DB_NAME=mydatabase
      - SECRET_KEY=S3cret_999
    depends_on:
      - db
  nginx:
    container_name: nginx
    restart: unless-stopped
    image: "nginx:stable-alpine"
    ports:
      - "5085:5085"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on: 
      appseed-app:
        condition: service_healthy    # Attend que l'app soit prête, pas juste lancée
    networks:
      - web_network
  db:
    image: alpine/mysql:15.2
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db_network
    
networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge

volumes:
  mysql_data:
